{% extends 'base.html' %}

{% block title %}Create Event - Eventify{% endblock %}

{% block content %}
<h2 class="mb-4">Create New Event</h2>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save Event</button>
</form>
{% endblock %}
