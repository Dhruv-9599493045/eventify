{% extends 'base.html' %}

{% block title %}{% if editing %}Edit Event{% else %}Create Event{% endif %} - Eventify{% endblock %}

{% block content %}
<h2 class="mb-4">{% if editing %}Edit Event{% else %}Create New Event{% endif %}</h2>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary btn-pill">
        {% if editing %}Save Changes{% else %}Save Event{% endif %} →
    </button>
</form>
{% endblock %}
